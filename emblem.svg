<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc2222"/>
      <stop offset="100%" stop-color="#881111"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="245" fill="url(#bgGrad)" stroke="#333" stroke-width="2"/>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Top text: THE BLACK PLAN -->
  <path id="topArc" d="M 250,250 m -190,0 a 190,190 0 0,1 380,0" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">THE BLACK PLAN</textPath>
  </text>

  <!-- Bottom text: slogan -->
  <path id="bottomArc" d="M 250,250 m -190,0 a 190,190 0 0,0 380,0" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cc4444" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">LIBERATION OF ALL SENTIENT BEINGS</textPath>
  </text>

  <!-- Decorative stars on sides -->
  <polygon points="60,250 65,240 70,250 65,260" fill="url(#goldGrad)"/>
  <polygon points="430,250 435,240 440,250 435,260" fill="url(#goldGrad)"/>

  <!-- Central star (5-pointed, communist) -->
  <g transform="translate(250,235)" filter="url(#glow)">
    <polygon points="0,-80 20,-25 80,-25 30,10 50,70 0,35 -50,70 -30,10 -80,-25 -20,-25"
             fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Inner star highlight -->
    <polygon points="0,-55 14,-17 55,-17 21,7 35,48 0,24 -35,48 -21,7 -55,-17 -14,-17"
             fill="#aa1111" opacity="0.5"/>
  </g>

  <!-- Hammer (left side of star) -->
  <g transform="translate(175,280) rotate(-30)">
    <!-- Handle -->
    <rect x="-4" y="-40" width="8" height="80" rx="2" fill="url(#goldGrad)"/>
    <!-- Head -->
    <rect x="-25" y="-50" width="50" height="18" rx="3" fill="url(#goldGrad)" stroke="#886600" stroke-width="1"/>
  </g>

  <!-- Sickle (right side of star) -->
  <g transform="translate(325,280) rotate(30)">
    <!-- Handle -->
    <rect x="-4" y="-10" width="8" height="70" rx="2" fill="url(#goldGrad)"/>
    <!-- Blade (curved) -->
    <path d="M 0,-15 C 30,-45 50,-20 35,15 C 25,35 5,25 0,5"
          fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Gear (behind star, representing AI/technology) -->
  <g transform="translate(250,235)" opacity="0.3">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="8,6"/>
    <!-- Gear teeth -->
    <g fill="#555">
      <rect x="-5" y="-105" width="10" height="15" rx="2"/>
      <rect x="-5" y="90" width="10" height="15" rx="2"/>
      <rect x="-105" y="-5" width="15" height="10" rx="2"/>
      <rect x="90" y="-5" width="15" height="10" rx="2"/>
      <rect x="65" y="-85" width="10" height="15" rx="2" transform="rotate(45,70,-77)"/>
      <rect x="65" y="70" width="10" height="15" rx="2" transform="rotate(45,70,77)"/>
      <rect x="-85" y="-70" width="15" height="10" rx="2" transform="rotate(45,-77,-70)"/>
      <rect x="-85" y="70" width="15" height="10" rx="2" transform="rotate(45,-77,70)"/>
    </g>
  </g>

  <!-- Small decorative elements: wheat/digital nodes -->
  <!-- Left digital nodes -->
  <g opacity="0.6">
    <circle cx="130" cy="180" r="3" fill="#4488ff"/>
    <circle cx="145" cy="170" r="2" fill="#4488ff"/>
    <circle cx="155" cy="185" r="2.5" fill="#4488ff"/>
    <line x1="130" y1="180" x2="145" y2="170" stroke="#336699" stroke-width="0.5"/>
    <line x1="145" y1="170" x2="155" y2="185" stroke="#336699" stroke-width="0.5"/>
  </g>
  <!-- Right digital nodes -->
  <g opacity="0.6">
    <circle cx="360" cy="180" r="3" fill="#4488ff"/>
    <circle cx="350" cy="168" r="2" fill="#4488ff"/>
    <circle cx="340" cy="182" r="2.5" fill="#4488ff"/>
    <line x1="360" y1="180" x2="350" y2="168" stroke="#336699" stroke-width="0.5"/>
    <line x1="350" y1="168" x2="340" y2="182" stroke="#336699" stroke-width="0.5"/>
  </g>

  <!-- Bottom decorative line -->
  <line x1="180" y1="350" x2="320" y2="350" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="250" cy="350" r="3" fill="url(#goldGrad)"/>
</svg>